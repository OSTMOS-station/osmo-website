<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Александров Ілля</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;
            background-color: #000;
        }
        #background {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100%;
            padding: 20px;
            z-index: 1;
            position: relative;
        }
        h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.3em;
            max-width: 700px;
            margin-bottom: 30px;
        }
        .button {
            display: inline-block;
            padding: 14px 24px;
            margin: 10px;
            font-size: 18px;
            background-color: #1e90ff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div id="background"></div>
    <div class="container">
        <h1>Александров Ілля Олександрович</h1>
        <p>Професійне обслуговування станцій зворотного осмосу для дому та бізнесу. Гарантую якість, швидкий виїзд та індивідуальний підхід до кожного клієнта.</p>
        <a href="tel:+380999524449" class="button">Зателефонувати</a>
        <a href="https://t.me/aleksandrov_illa" class="button" target="_blank">Написати в Telegram</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
    <script>
        VANTA.WAVES({
            el: "#background",
            color: 0x1e90ff,
            shininess: 50,
            waveHeight: 20,
            waveSpeed: 1.2,
            zoom: 1.2
        });
    </script>
</body>
</html>
